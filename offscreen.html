<!DOCTYPE html>
<html>
<head><title>OpenWeb Keepalive</title></head>
<body>
<script>
// Offscreen document holds a persistent port to the service worker.
// As long as this port is open, MV3 keeps the service worker alive indefinitely.
let port;
function connectPort() {
  port = chrome.runtime.connect({ name: "keepalive" });
  port.onDisconnect.addListener(() => {
    // Wait for SW to come back, then reconnect
    setTimeout(connectPort, 1000);
  });
}
connectPort();

// Also ping every 20s to keep traffic flowing (defense-in-depth)
setInterval(() => {
  try { port && port.postMessage({ type: "ping" }); } catch {}
}, 20000);
</script>
</body>
</html>
